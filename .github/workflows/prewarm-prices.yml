name: Daily Post-Market D1 Price Pre-Warm

# Designed for Private GitHub Repositories (Free tier: 2,000 min/month).
# Runs ~1 min/weekday (~22 min/month = ~1.1% of free private quota).
# Keeps Cloudflare Workers well below 10ms CPU limit and eliminates repeated upstream API hits.

on:
  schedule:
    # Mon-Fri 06:40 UTC = 14:40 Asia/Taipei (after TWSE/TPEx settlement)
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prewarm-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Multi-Source Verified Historical Reconciliation
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          node web/scripts/prewarm_prices.mjs --out=web/.prewarm_upserts.sql

      - name: Push Verified Closes to Cloudflare D1
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && hashFiles('web/.prewarm_upserts.sql') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute betacalculator_db --remote --file=web/.prewarm_upserts.sql --config=web/wrangler.toml
